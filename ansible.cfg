[defaults]
# Do not prompt on unknown host keys — VMs may not be in known_hosts
host_key_checking   = False
# Suppress the "ansible is using the python ... interpreter" advisory
interpreter_python  = auto_silent
# Human-readable output grouped by host
stdout_callback     = default
result_format       = yaml
# Suppress deprecation warnings from the managed node Python
deprecation_warnings = False

[ssh_connection]
# Send all module code over a single SSH connection instead of SFTP uploads
pipelining = True
