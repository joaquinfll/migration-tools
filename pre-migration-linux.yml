---
# Linux VMware Migration Pre-Checks Playbook
# Run standalone to validate a Linux VM before virt-v2v conversion.
# For consolidated vSphere + guest checks, use migration-prechecks.yml instead.
- name: Preflight checks for virtual machine in vSphere
  hosts: all
  gather_facts: false
  tasks:
    - name: Run Linux guest checks
      ansible.builtin.include_tasks: tasks/guest-checks-linux.yml

    - name: Aggregate results
      ansible.builtin.include_tasks: tasks/aggregate-checks.yml

    - name: Report results
      ansible.builtin.include_tasks: tasks/report-checks.yml
