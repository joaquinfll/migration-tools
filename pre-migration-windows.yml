---
# Windows VMware Migration Pre-Checks Playbook
# Run standalone to validate a Windows VM before virt-v2v conversion.
# Requires WinRM access to the target VM.
# For consolidated vSphere + guest checks, use migration-prechecks.yml instead.
- name: Preflight checks for Windows virtual machine in vSphere
  hosts: all
  gather_facts: false
  tasks:
    - name: Run Windows guest checks
      ansible.builtin.include_tasks: tasks/guest-checks-windows.yml

    - name: Aggregate results
      ansible.builtin.include_tasks: tasks/aggregate-checks.yml

    - name: Report results
      ansible.builtin.include_tasks: tasks/report-checks.yml
