---
- name: Test where 'is file' evaluates
  hosts: all
  gather_facts: false

  tasks:
    - name: Create a unique marker on the controller
      delegate_to: localhost
      run_once: true
      ansible.builtin.tempfile:
        state: file
        prefix: controller_only_
      register: marker

    - name: Test 'is file' against the controller-only marker
      ansible.builtin.debug:
        msg: "'is file' returned TRUE for {{ marker.path }}"
      when: "marker.path is file"
      register: jinja_test

    - name: Test 'stat' against the same path on the remote
      ansible.builtin.stat:
        path: "{{ marker.path }}"
      register: remote_stat

    - name: Verdict
      ansible.builtin.debug:
        msg: >-
          Jinja2 'is file' ran on: {{ 'CONTROLLER' if (jinja_test is not skipped) else 'REMOTE' }}.
          stat.exists on remote: {{ remote_stat.stat.exists }}.
          If 'is file'=true but stat.exists=false, the test ran on the controller.

    - name: Cleanup marker
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ marker.path }}"
        state: absent
