# Tasks file for processing CBT on a single VM.
# Called by cbt-enable.yml with loop_var: vm_name
---

- name: Get disk info for {{ vm_name }}
  community.vmware.vmware_guest_disk_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    name: "{{ vm_name }}"
    datacenter: "{{ dc_name }}"
  delegate_to: localhost
  no_log: true
  register: _disk_info

- name: Filter CBT-compatible disks for {{ vm_name }}
  vars:
    prefix_map:
      paravirtual: scsi
      lsilogic: scsi
      lsilogicsas: scsi
      sata: sata
      nvme: nvme
  set_fact:
    compatible_disks: >-
      {{ _disk_info.guest_disk_info | dict2items
         | map(attribute='value')
         | selectattr('backing_diskmode', 'defined')
         | selectattr('backing_diskmode', 'match', '^(persistent|dependent_.*)$')
         | list }}
  when: _disk_info.guest_disk_info | default({}) | length > 0

- name: Skip {{ vm_name }} — no compatible disks found
  debug:
    msg: "No CBT-compatible disks found for {{ vm_name }}. Skipping."
  when: compatible_disks | default([]) | length == 0

- name: Enable CBT and manage snapshot for {{ vm_name }}
  when: compatible_disks | default([]) | length > 0
  vars:
    prefix_map:
      paravirtual: scsi
      lsilogic: scsi
      lsilogicsas: scsi
      sata: sata
      nvme: nvme
    _cbt_settings: >-
      {%- set ns = namespace(s=[{'key': 'ctkEnabled', 'value': 'TRUE'}]) -%}
      {%- for d in compatible_disks -%}
      {%- set p = prefix_map.get(d.controller_type, 'scsi') -%}
      {%- set ns.s = ns.s + [{'key': p ~ (d.controller_bus_number | default(0) | string) ~ ':' ~ (d.unit_number | string) ~ '.ctkEnabled', 'value': 'TRUE'}] -%}
      {%- endfor -%}
      {{ ns.s | to_json }}
  block:

    - name: Apply CBT advanced settings to {{ vm_name }}
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        name: "{{ vm_name }}"
        datacenter: "{{ dc_name }}"
        state: present
        advanced_settings: "{{ _cbt_settings | from_json }}"
      delegate_to: localhost
      no_log: true

    - name: Create temporary snapshot to activate CBT on {{ vm_name }}
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        name: "{{ vm_name }}"
        datacenter: "{{ dc_name }}"
        state: present
        snapshot_name: "{{ snapshot_name }}"
      delegate_to: localhost
      no_log: true
      register: _snapshot_result

  rescue:

    - name: Report CBT failure for {{ vm_name }}
      debug:
        msg: >-
          CBT enablement failed for {{ vm_name }}.
          Error: {{ ansible_failed_result.msg | default('unknown error') }}

  always:

    - name: Remove temporary snapshot from {{ vm_name }}
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        name: "{{ vm_name }}"
        datacenter: "{{ dc_name }}"
        state: absent
        snapshot_name: "{{ snapshot_name }}"
      delegate_to: localhost
      no_log: true
      when: _snapshot_result is defined and _snapshot_result is not skipped
